<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>06 · Your World</title>
<link rel="stylesheet" href="../lib/stage.css">
<style>
  /* A night drive built out of the design system's own hairlines.

     There is no footage in this piece and no CSS 3D either. Every element
     is placed by projecting a point in a camera space onto the frame by
     hand — s = P / (P - z) — which keeps the type crisp at every scale.
     A browser's own perspective rasterises a layer once and then scales
     the bitmap, so a word rushing at the camera arrives soft; projecting
     it ourselves means the glyphs are re-rendered at the size they are
     actually drawn at. */

  #top {
    position: absolute; left: 7vmin; right: 7vmin; top: 6vmin;
    display: flex; align-items: center; gap: 1.4vmin; z-index: 40;
  }
  #top .spacer { flex: 1 1 auto; }
  #toprule {
    position: absolute; left: 7vmin; right: 7vmin; top: 8.8vmin;
    transform-origin: left; z-index: 40;
  }

  #plate {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
    /* Held back so the type reads over it. A plate at full strength and a
       hairline world on top of it fight each other. */
    /* Replaced per render: render.mjs measures the plate and solves for a
       brightness that lands it where the drawn world sits. This is only
       the fallback for opening the scene by hand. */
    filter: saturate(0.3) contrast(1.08) brightness(0.45);
  }
  #plate[src] { display: block; }
  /* With a plate present the drawn world gets out of the way entirely.
     The footage is the world; what stays is the type, the chrome, the
     vignette and the grain. */
  body[data-plate] .mark,
  body[data-plate] .dash,
  body[data-plate] .post,
  body[data-plate] .lamp,
  body[data-plate] .bld,
  body[data-plate] .win,
  body[data-plate] .car,
  body[data-plate] #horizon { opacity: 0 !important; }

  #scrim {
    position: absolute; left: 0; right: 0; top: 0; height: 13vmin;
    background-color: var(--color-ink);
    opacity: 0; z-index: 20;
  }
  body[data-plate] #scrim { opacity: 0.62; }

  #road { position: absolute; inset: 0; overflow: hidden; }
  #worldlayer { position: absolute; inset: 0; will-change: transform; }
  #rain { position: absolute; inset: 0; overflow: hidden; z-index: 25; pointer-events: none; }
  .drop {
    position: absolute; left: 0; top: 0;
    background-color: var(--color-bone-dim);
    will-change: transform;
  }
  .mark, .dash, .post, .lamp {
    position: absolute; left: 0; top: 0;
    background-color: var(--color-line);
    will-change: transform;
  }
  /* --color-line is 14% alpha, which is right for a hairline on a page and
     far too faint for a road lit by headlights. The surface takes the hard
     line and the lane markings take bone: they are painted, and paint in a
     beam is the brightest thing in a night frame. */
  .mark { background-color: var(--color-line-hard); }
  .dash { background-color: var(--color-bone-mute); }
  .lamp { background-color: var(--color-magenta); }
  .bld {
    position: absolute; left: 0; top: 0;
    background-color: var(--color-ink-deep);
    border-top: 1px solid var(--color-line);
    will-change: transform;
  }
  .win, .car {
    position: absolute; left: 0; top: 0;
    background-color: var(--color-bone-mute);
    will-change: transform;
  }
  .car { background-color: var(--color-bone); }
  /* Wet asphalt. A light on a dry road is a dot; on a wet one it has a
     tail, and that tail is most of what makes night footage read as night
     footage rather than as a dark diagram. */
  .refl { position: absolute; left: 0; top: 0; will-change: transform; }
  #horizon {
    position: absolute; left: 0; right: 0;
    height: 1px; background-color: var(--color-line-hard);
  }

  /* Words are laid out at a base size and scaled by setting font-size, so
     they stay sharp however close they get. */
  .word {
    position: absolute; left: 0; top: 0;
    white-space: nowrap;
    font-family: var(--font-display);
    font-weight: 800;
    font-stretch: 64%;
    line-height: 0.82;
    letter-spacing: -0.028em;
    text-transform: uppercase;
    color: var(--color-bone);
    will-change: transform;
  }

  #land {
    position: absolute; left: 7vmin; right: 7vmin; top: 50%;
    transform: translateY(-50%); z-index: 30;
  }
  #land .wordmark { font-size: 13vmin; }
  #landrule {
    display: block; height: 1px; background-color: var(--color-line);
    margin: 4vmin 0 2.6vmin; transform-origin: left;
  }
  #land .row { display: flex; align-items: baseline; gap: 2vmin; }
  #land .spacer { flex: 1 1 auto; }
  #landtag { font-size: 2vmin; }

  @media (max-aspect-ratio: 13/10) {
    #land .wordmark { font-size: 10.5vmin; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="frame" style="padding:0">
    <!-- Optional background plate. The renderer fills this per frame when
         it is given --plate; with no plate it stays empty and the world is
         the only thing on screen. Licensed or self-shot footage drops in
         here without touching anything else in the piece. -->
    <img id="plate" alt="">

    <!-- A flat slate under the chrome, only when there is a plate. Mono
         at label size does not survive over moving footage, and this is
         how the site handles the same problem: a flat ink field, hard
         edges, no blur and no gradient. -->
    <i id="scrim"></i>

    <div id="road">
      <!-- Everything in the world sits in here so camera roll can be
           applied to the world without tilting the type with it. -->
      <div id="worldlayer"><i id="horizon"></i></div>
    </div>

    <!-- Rain is on the windscreen, not in the world: it does not roll with
         the camera and it has no perspective. -->
    <div id="rain"></div>

    <header id="top">
      <span class="dot"></span>
      <span class="t-label">AEGIS AI</span>
      <span class="spacer"></span>
      <span class="t-label dim" id="phase">YOUR WORLD</span>
    </header>
    <hr class="rule" id="toprule">

    <div id="land">
      <span class="mask"><span class="wordmark" id="mark">AEGIS AI</span></span>
      <i id="landrule"></i>
      <div class="row">
        <span class="t-mono dim" id="landtag">Your World. Your AI. Your Story.</span>
        <span class="spacer"></span>
        <span class="t-label mute" id="landstamp">PRE-ALPHA · BUILD 0.1.0 · NOT SHIPPED</span>
      </div>
    </div>
  </div>
  <div class="tex-vignette"></div>
  <div class="tex-grain" id="grain"></div>
</div>

<script type="module">
import { EASE, seg, clamp, lerp, noise, grain } from "../lib/timeline.js";

const $ = (id) => document.getElementById(id);

/* ── Tempo ───────────────────────────────────────────────────
   120 BPM, so a beat is exactly 15 frames at 30fps and every cut
   in the piece lands on a whole frame. The reference this was cut
   against measured 124.8 BPM; 120 keeps the same feel and keeps
   the grid integral, which matters more. */
const BPM = 120;
const BEAT = 60 / BPM;            // 0.5s
const BEATS = 28;
const DURATION = BEAT * BEATS;    // 14.0s
const FPS = 30;

/* ── Camera ──────────────────────────────────────────────────
   Distances are in the frame's own pixels. Both masters are 1080
   tall, so one projection serves 16:9 and 1:1 alike. */
const P = 1000;                   // focal length
const GY = 420;                   // ground, below the camera axis
const STEP = 240;                 // spacing between road marks
const N_MARK = 30;
const DEPTH = N_MARK * STEP;
/* Marks are allowed to travel past the camera plane. Stopping them at z = 0
   caps the scale at 1, which leaves the road a narrow fan in the middle of
   the frame instead of rushing out past the bottom corners. */
const PAST = 420;
const SPAN = DEPTH + PAST;
const MARK_W = 2600;
const POST_X = 1560;   // outside the road edge, not on it
const POST_H = 250;

const road = $("road");
const worldLayer = $("worldlayer");
const mk = (cls) => { const e = document.createElement("i"); e.className = cls; worldLayer.appendChild(e); return e; };

/* ── The bend ────────────────────────────────────────────────
   A dead straight road is the most diagram-like thing a drive can
   do. The lateral offset of a point is a slow sine of its absolute
   position along the road, minus the camera's own offset, so the
   road always leaves the camera centred and curves away from it. */
const BEND_A = 820;
const BEND_L = 2900;
const lat = (d, dist) =>
  BEND_A * (Math.sin((dist + d) / BEND_L) - Math.sin(dist / BEND_L));

/* ── The tunnel ──────────────────────────────────────────────
   Bars three and four. The sky closes, a ceiling appears, the posts
   grow into wall ribs, and it opens again — an act change in the
   world to go with the one in the arrangement. */
const TUN_IN = 12 * BEAT, TUN_OUT = 17 * BEAT;
const CEIL = 330;
const marks = Array.from({ length: N_MARK }, () => mk("mark"));
const dashes = Array.from({ length: N_MARK }, () => mk("dash"));
const posts = [], lamps = [];
for (let i = 0; i < N_MARK; i++) {
  if (i % 3) { posts.push(null); lamps.push(null); continue; }
  posts.push([mk("post"), mk("post")]);
  lamps.push([mk("lamp"), mk("lamp")]);
}

/* ── Tunnel ceiling and wet reflections ──────────────────────
   The ceiling is the road again, mirrored above the camera axis.
   Reflections are a streak under every light that touches tarmac. */
const ceils = Array.from({ length: N_MARK }, () => mk("mark"));
const lrefl = posts.map((p) => (p ? [mk("refl"), mk("refl")] : null));
for (const pair of lrefl) {
  if (pair) for (const e of pair) e.style.backgroundColor = "var(--color-magenta)";
}

/* ── Rain on the glass ───────────────────────────────────────
   Screen space, no perspective. Most drops crawl; a few run. */
const N_RAIN = 130;
const rainBox = $("rain");
const drops = [];
for (let i = 0; i < N_RAIN; i++) {
  const el = document.createElement("i");
  el.className = "drop";
  rainBox.appendChild(el);
  const runner = noise(i * 4.4) > 0.80;
  drops.push({
    el, runner,
    fx: noise(i * 2.9),
    off: noise(i * 6.3),
    spd: runner ? 0.55 + noise(i * 8.1) * 0.9 : 0.045 + noise(i * 3.3) * 0.075,
    len: runner ? 26 + noise(i * 9.7) * 46 : 4 + noise(i * 5.1) * 9,
    w: noise(i * 7.1) > 0.7 ? 2 : 1,
  });
}

/* ── Distant lights ──────────────────────────────────────────
   Without them the upper half of the frame is empty black and the
   drive has nothing to parallax against. Positions come from the
   hash noise, never Math.random, so every render is the same. */
const N_PT = 90;
const pts = [];
for (let i = 0; i < N_PT; i++) {
  const el = mk("mark");
  el.style.backgroundColor = i % 11 === 0 ? "var(--color-magenta)" : "var(--color-bone-mute)";
  pts.push({
    el,
    x: (noise(i * 3.1) - 0.5) * 9000,
    y: -lerp(60, 900, noise(i * 7.7)),
    z0: noise(i * 13.3) * DEPTH,
    big: noise(i * 5.5) > 0.86,
  });
}

/* ── Skyline ─────────────────────────────────────────────────
   Blocks of deeper ink with a lit top edge, far enough back that
   they barely parallax — which is what makes the road in front of
   them feel fast. Lit windows are the only warm thing out there. */
const N_BLD = 24;
const SKY_NEAR = 9000, SKY_SPAN = 15000;
const blds = [];
for (let i = 0; i < N_BLD; i++) {
  const el = document.createElement("i");
  el.className = "bld";
  road.appendChild(el);
  const wins = [];
  const nw = 3 + Math.floor(noise(i * 2.3) * 5);
  for (let k = 0; k < nw; k++) {
    const q = document.createElement("i");
    q.className = "win";
    road.appendChild(q);
    wins.push({ el: q, fx: noise(i * 31 + k * 3.7), fy: noise(i * 17 + k * 9.1) });
  }
  blds.push({
    el, wins,
    x: (noise(i * 1.7) - 0.5) * 11000,
    w: 240 + noise(i * 4.9) * 520,
    h: 340 + noise(i * 8.3) * 1250,
    z0: noise(i * 6.1) * SKY_SPAN,
  });
}

/* ── Oncoming traffic ────────────────────────────────────────
   Pairs of lights in the far lane, closing faster than the road
   moves. Five of them is enough to say the world is inhabited. */
const N_CAR = 5;
const cars = [];
for (let i = 0; i < N_CAR; i++) {
  const pair = [document.createElement("i"), document.createElement("i")];
  for (const e of pair) { e.className = "car"; road.appendChild(e); }
  const refl = [document.createElement("i"), document.createElement("i")];
  for (const e of refl) { e.className = "refl"; e.style.backgroundColor = "var(--color-bone)"; worldLayer.appendChild(e); }
  cars.push({ pair, refl, z0: noise(i * 11.9) * DEPTH * 1.6, x: -620 - noise(i * 5.3) * 420 });
}

/* ── The words, in camera space ──────────────────────────────
   The tagline is the piece. Each line is born far away on a beat
   and passes the camera four beats later. */
const SCRIPT = [
  { text: "YOUR WORLD.", at: 2,  dur: 4, size: 170 },
  { text: "YOUR AI.",    at: 6,  dur: 4, size: 170 },
  { text: "YOUR STORY.", at: 10, dur: 4, size: 170 },
  { text: "IT RUNS BESIDE THE GAME.", at: 14, dur: 4, size: 82 },
  { text: "NOT INSIDE IT.",           at: 18, dur: 4, size: 124 },
];
const words = SCRIPT.map((w) => {
  const el = document.createElement("span");
  el.className = "word";
  el.textContent = w.text;
  /* The full stop carries the accent, exactly as it does on the site. */
  if (w.text.endsWith(".")) {
    el.textContent = w.text.slice(0, -1);
    const dot = document.createElement("span");
    dot.className = "magenta";
    dot.textContent = ".";
    el.appendChild(dot);
  }
  road.appendChild(el);
  return el;
});

const LAND_AT = 22 * BEAT;        // the drive stops and the mark parks

function draw(t, frame) {
  grain($("grain"), frame);

  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2;
  $("toprule").style.transform = `scaleX(${seg(t, 0.06, 1.2, EASE.outExpo)})`;

  /* Travel. The drive runs at speed until the landing beat, then is
     brought to a stop over two beats — the only easing in the world. */
  const cruise = 1500;                       // px per second
  const brake = 1 - seg(t, LAND_AT - 1.2, 2.0, EASE.outExpo);
  const moving = t < LAND_AT - 1.2 ? 1 : Math.max(brake, 0);
  const dist = t < LAND_AT - 1.2
    ? t * cruise
    : (LAND_AT - 1.2) * cruise + (t - (LAND_AT - 1.2)) * cruise * moving;

  /* Suspension, and it settles when the car does. Three incommensurate
     sines rather than one: a single frequency reads as a bounce, and the
     eye catches the loop in about two seconds. */
  const cy = H * 0.52 +
    (4.2 * Math.sin(t * 5.3) + 2.6 * Math.sin(t * 9.1) + 1.4 * Math.sin(t * 14.3)) * moving;
  const roll = (0.17 * Math.sin(t * 3.1) + 0.09 * Math.sin(t * 7.7)) * moving;
  worldLayer.style.transform = `rotate(${roll}deg)`;
  $("horizon").style.top = `${Math.round(cy)}px`;

  const tun = seg(t, TUN_IN, 0.55, EASE.inOutSine) *
              (1 - seg(t, TUN_OUT - 0.55, 0.55, EASE.inOutSine));

  for (let i = 0; i < N_MARK; i++) {
    const z = -DEPTH + ((i * STEP + dist) % SPAN);
    const s = P / (P - z);
    const y = cy + GY * s;
    /* In out of the far dark, out again once it is past the camera, and
       brighter the closer it gets: a headlight falls off with distance,
       and a road drawn at even weight all the way to the horizon is the
       single thing that most makes a drive look like a diagram. */
    const light = 0.18 + 0.82 * Math.pow(clamp((DEPTH + z) / DEPTH), 2.4);
    const op = clamp((DEPTH + z) / (DEPTH * 0.62)) *
               (1 - clamp((z - 120) / 280)) * light;

    /* Where this slice of road sits sideways. World units, scaled by the
       same s as everything else on it. */
    const laneX = lat(-z, dist);

    const m = marks[i].style;
    const w = MARK_W * s;
    m.width = `${w}px`;
    m.height = `${Math.max(1, s * 1.6)}px`;
    m.transform = `translate3d(${cx + laneX * s - w / 2}px, ${y}px, 0)`;
    m.opacity = String(op * 0.85);

    /* The tunnel ceiling is the road again, mirrored above the axis. */
    /* Narrower than the road and dimmer than it: a full-width lid reads as
       a box, not as something overhead. */
    const cw = w * 0.6;
    const c = ceils[i].style;
    c.width = `${cw}px`;
    c.height = `${Math.max(1, s * 1.4)}px`;
    c.transform = `translate3d(${cx + laneX * s - cw / 2}px, ${cy - CEIL * s}px, 0)`;
    c.opacity = String(op * 0.4 * tun);

    /* Centre dashes: a segment of road, projected at both ends. */
    const z2 = z - 120;
    const s2 = P / (P - z2);
    const y2 = cy + GY * s2;
    const d = dashes[i].style;
    d.width = `${Math.max(1, 7 * s)}px`;
    d.height = `${Math.max(1, y - y2)}px`;
    d.transform = `translate3d(${cx + laneX * s - 3.5 * s}px, ${y2}px, 0)`;
    d.opacity = String(op * (i % 2 ? 0.0 : 0.9));

    if (!posts[i]) continue;
    /* Posts grow into wall ribs through the tunnel. */
    const ph = POST_H * s * (1 + 1.7 * tun);
    for (const [k, sign] of [[0, -1], [1, 1]]) {
      const px = cx + (laneX + sign * POST_X) * s;
      const ps = posts[i][k].style;
      ps.width = "1px";
      ps.height = `${ph}px`;
      ps.transform = `translate3d(${px}px, ${y - ph}px, 0)`;
      ps.opacity = String(op * 0.7);
      const ls = lamps[i][k].style;
      const lw = Math.max(1, 5 * s);
      ls.width = `${lw}px`;
      ls.height = `${lw}px`;
      ls.transform = `translate3d(${px - lw / 2}px, ${y - ph - lw / 2}px, 0)`;
      ls.opacity = String(op);
      /* The lamp's smear on wet tarmac, straight down from its own foot. */
      const rs = lrefl[i][k].style;
      const rl = 120 * s;
      rs.width = `${Math.max(1, 3 * s)}px`;
      rs.height = `${rl}px`;
      rs.transform = `translate3d(${px - 1.5 * s}px, ${y}px, 0)`;
      rs.opacity = String(op * 0.34 * (1 - tun));
    }
  }

  for (const b of blds) {
    /* Stays in [-(NEAR+SPAN), -NEAR]: the skyline is always far. The
       first cut added SPAN back on and let the buildings run past the
       camera, which put tower blocks on top of the type. */
    const z = -(SKY_NEAR + SKY_SPAN) + ((b.z0 + dist * 0.5) % SKY_SPAN);
    const s = P / (P - z);
    const w = b.w * s, h = b.h * s;
    const x = cx + b.x * s - w / 2;
    const yb = cy + GY * s;
    const st = b.el.style;
    st.width = `${w}px`;
    st.height = `${h}px`;
    st.transform = `translate3d(${x}px, ${yb - h}px, 0)`;
    st.opacity = String(1 - tun);
    for (const win of b.wins) {
      const ws = Math.max(1, 3.4 * s);
      const q = win.el.style;
      q.width = `${ws}px`;
      q.height = `${ws * 1.6}px`;
      q.transform =
        `translate3d(${x + win.fx * (w - ws)}px, ${yb - h + win.fy * h * 0.9}px, 0)`;
      q.opacity = String(0.75 * (1 - tun));
    }
  }

  for (const car of cars) {
    const z = -DEPTH * 1.6 + ((car.z0 + dist * 1.9) % (DEPTH * 1.6 + 300));
    const s = P / (P - z);
    const op = clamp((DEPTH * 1.6 + z) / (DEPTH * 0.9)) * (1 - clamp((z - 40) / 200));
    const w = Math.max(1, 8 * s);
    const yb = cy + (GY - 70) * s;
    const laneX = lat(-z, dist);
    for (const [k, off] of [[0, -58], [1, 58]]) {
      const px = cx + (laneX + car.x + off) * s;
      const st = car.pair[k].style;
      st.width = `${w}px`;
      st.height = `${Math.max(1, 5 * s)}px`;
      st.transform = `translate3d(${px - w / 2}px, ${yb}px, 0)`;
      st.opacity = String(op);
      const rs = car.refl[k].style;
      rs.width = `${Math.max(1, w * 0.5)}px`;
      rs.height = `${Math.max(1, 90 * s)}px`;
      rs.transform = `translate3d(${px - w * 0.25}px, ${yb + 8 * s}px, 0)`;
      rs.opacity = String(op * 0.4);
    }
  }

  for (const pt of pts) {
    const z = -DEPTH + ((pt.z0 + dist) % SPAN);
    const s = P / (P - z);
    const w = Math.max(1, (pt.big ? 5 : 2.6) * s);
    const st = pt.el.style;
    st.width = `${w}px`;
    st.height = `${w}px`;
    st.transform = `translate3d(${cx + pt.x * s - w / 2}px, ${cy + pt.y * s - w / 2}px, 0)`;
    st.opacity = String(
      clamp((DEPTH + z) / (DEPTH * 0.5)) * (1 - clamp((z - 60) / 240)) * 0.75 * (1 - tun),
    );
  }

  for (const d of drops) {
    const yF = ((t * d.spd + d.off) % 1.25) - 0.12;
    const st = d.el.style;
    st.width = `${d.w}px`;
    st.height = `${d.len}px`;
    st.transform = `translate3d(${d.fx * W}px, ${yF * H}px, 0)`;
    st.opacity = String(
      (d.runner ? 0.26 : 0.14) * (0.4 + 0.6 * moving) *
      clamp(yF / 0.04) * clamp((1.06 - yF) / 0.08),
    );
  }

  /* Words. z runs from far to past the camera across the window, so the
     line is readable in the middle of its pass and blows out at the end. */
  SCRIPT.forEach((w, i) => {
    const t0 = w.at * BEAT, t1 = t0 + w.dur * BEAT;
    const el = words[i];
    if (t < t0 || t >= t1) { el.style.opacity = "0"; return; }
    const u = (t - t0) / (t1 - t0);
    /* Constant speed through z, stopping short of the focal plane: at
       z = P the scale is a division by zero. Starting at -2400 rather
       than far away spends more of the window in the readable band,
       which is the whole reason the line is on screen. */
    const z = lerp(-2400, 820, u);
    const s = P / (P - z);
    el.style.fontSize = `${w.size * s}px`;
    /* The line leaves by outgrowing the frame, not by dimming. Fading a
       word out while it is still legible is what made the first cut read
       as grey type rather than as something going past the camera. */
    el.style.opacity = String(clamp(u / 0.10) * clamp((1 - u) / 0.07));
    /* Measured after the size is set, so the line is centred at whatever
       width the condensed cut actually gives it. */
    const bw = el.offsetWidth, bh = el.offsetHeight;
    el.style.transform = `translate3d(${cx - bw / 2}px, ${cy - 40 * s - bh / 2}px, 0)`;
  });

  /* Landing. */
  const lt = t - LAND_AT;
  $("land").style.display = lt >= -0.4 ? "" : "none";
  if (lt >= -0.4) {
    const p = seg(lt, 0.0, 0.85, EASE.outExpo);
    $("mark").style.translate = `0 ${(1 - p) * 132}%`;
    $("landrule").style.transform = `scaleX(${seg(lt, 0.55, 1.0, EASE.outExpo)})`;
    $("landtag").style.opacity = String(seg(lt, 0.85, 0.6, EASE.linear));
    $("landstamp").style.opacity = String(seg(lt, 1.10, 0.6, EASE.linear));
  }
  $("phase").textContent = t < 14 * BEAT ? "YOUR WORLD" : t < LAND_AT ? "THE POSITION" : "PRE-ALPHA";
}

await document.fonts.ready;
draw(0, 0);

window.SCENE = { fps: FPS, duration: DURATION, draw, ready: true };
</script>
</body>
</html>
